spring.application.name=failure-simulator

# H2 in-memory DB for safe local runs
spring.datasource.url=jdbc:h2:mem:failures;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP intentionally tiny to simulate pool exhaustion
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=FailureSimPool

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL and bind parameters to make N+1 visible
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Actuator for quick observability checks
management.endpoints.web.exposure.include=health,info,metrics,threaddump

# Server settings to keep requests bounded
server.tomcat.threads.max=50
server.tomcat.connection-timeout=5s
